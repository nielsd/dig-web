## a non caching full recursive resolver config for bind
## runs on the same machine as web-dig

acl "trusted" {
    localhost;
    localnets;
};

options {
    directory "/var/cache/bind";

    recursion yes;
    allow-recursion { trusted; };
    allow-query { trusted; };
    allow-query-cache { trusted; };

    // === no Caching ===
    max-cache-ttl 0;
    max-ncache-ttl 0;
    max-cache-size 0;
    // zusätzliche Absicherung
    max-recursion-depth 10;
    max-recursion-queries 100;

    // Keine Forwarder – volle Rekursion
    forwarders { };
    forward only;

    // DNSSEC off
    dnssec-validation no;       // you may switch to on if you prefer
    // dnssec-validation auto;   // if you switch on dnssec

    auth-nxdomain no;
    listen-on port 53 { 127.0.0.1; };
    listen-on-v6 port 53 { ::1; };
    version "hidden";

    // Performance / Debugging
    minimal-responses no;          // full answers
    qname-minimization off;        // classic behaviour
    // empty-zones-enable no;      // if empty zones boring you
};

logging {
    channel query_log {
        file "/var/log/named/queries.log" versions 10 size 50m;
        severity info;
        print-time yes;
        print-category yes;
        print-severity yes;
    };

    channel general_log {
        file "/var/log/named/named.log" versions 5 size 20m;
        severity info;
        print-time yes;
        print-category yes;
        print-severity yes;
    };

    category queries { query_log; };
    category default { general_log; };
    category general { general_log; };
    category resolver { general_log; };
    category query-errors { general_log; };
};

// for defauklt zones (if you want it)
// include "/etc/bind/named.conf.default-zones";
